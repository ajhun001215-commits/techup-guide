<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kt cloud 테크업 가이드</title>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --bg:#F5F0E6; --surface:#FFFFFF; --surface-alt:#EDE6D6; --surface-raised:#FFFFFF;
  --ink:#221F1A; --ink-soft:#6E6759; --ink-faint:#A79F8F;
  --border:#E2D9C6; --border-soft:#EBE3D2;
  --accent:#B4607A; --accent-soft:#F3E4E7; --accent-ink:#7A3B4C; --accent-deep:#33202A;
  --shadow: 0 18px 40px -22px rgba(20,15,5,.28);
  --radius-lg: 22px; --radius-md: 14px; --radius-sm: 9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131110; --surface:#1C1917; --surface-alt:#23201C; --surface-raised:#211E1B;
    --ink:#EFEAE1; --ink-soft:#A29A8B; --ink-faint:#6E685D;
    --border:#332E27; --border-soft:#2A2620;
    --accent-soft:#2C1F24; --accent-ink:#E3A9B8;
    --shadow: 0 18px 44px -20px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#131110; --surface:#1C1917; --surface-alt:#23201C; --surface-raised:#211E1B;
  --ink:#EFEAE1; --ink-soft:#A29A8B; --ink-faint:#6E685D;
  --border:#332E27; --border-soft:#2A2620;
  --accent-soft:#2C1F24; --accent-ink:#E3A9B8;
  --shadow: 0 18px 44px -20px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Noto Sans KR',"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{ font-family:'JetBrains Mono',ui-monospace,monospace; }
h1,h2,h3{ text-wrap:balance; margin:0; }
p{ margin:0; }
img{ max-width:100%; }
::selection{ background:var(--accent); color:#fff; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:4px; }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}

/* ---------- shell ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
}
.topbar-inner{
  max-width:1180px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  background:#0A0A0A; border-radius:8px; flex:0 0 auto;
  padding:7px 11px 8px; display:flex; flex-direction:column; gap:3px; line-height:1;
}
.brand-mark .bm-kt{
  font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700; color:#fff;
  display:flex; align-items:center; gap:3px; letter-spacing:.01em; text-transform:lowercase;
}
.brand-mark .bm-dot{ width:4px; height:4px; border-radius:50%; background:#E8482C; font-style:normal; }
.brand-mark .bm-techup{ font-size:13.5px; font-weight:900; color:#fff; letter-spacing:-.01em; }
.brand-text{ line-height:1.25; }
.brand-text b{ display:block; font-size:15px; font-weight:900; letter-spacing:-.01em; }
.brand-text span{ display:block; font-size:11px; color:var(--ink-soft); letter-spacing:.02em; }
.theme-toggle{
  border:1px solid var(--border); background:var(--surface-alt); color:var(--ink-soft);
  border-radius:100px; padding:7px 13px; font-size:12px; cursor:pointer;
  font-family:inherit; white-space:nowrap;
}

.tracktabs{
  max-width:1180px; margin:0 auto; padding:0 20px 14px;
  display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;
}
.tracktabs::-webkit-scrollbar{ display:none; }
.tracktab{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  border:1px solid var(--border); background:var(--surface);
  color:var(--ink-soft); border-radius:100px; padding:9px 16px 9px 10px;
  font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  transition:border-color .18s ease, color .18s ease, background .18s ease;
}
.tracktab .num{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
  width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--surface-alt); color:var(--ink-faint);
}
.tracktab[aria-selected="true"]{
  border-color:var(--accent); color:var(--ink); background:var(--accent-soft);
}
.tracktab[aria-selected="true"] .num{ background:var(--accent); color:#fff; }
.tracktab:hover{ border-color:var(--accent); }

/* ---------- hero ---------- */
.hero{
  max-width:1180px; margin:0 auto; padding:56px 20px 44px;
  display:grid; grid-template-columns:1.3fr 1fr; gap:40px; align-items:end;
}
.hero-eyebrow{
  font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700;
  color:var(--accent-ink); letter-spacing:.08em; text-transform:uppercase;
  display:flex; align-items:center; gap:8px; margin-bottom:16px;
}
.hero-eyebrow::before{ content:""; width:26px; height:1px; background:var(--accent); }
.hero h1{
  font-size:clamp(28px,4vw,44px); font-weight:900; letter-spacing:-.02em; line-height:1.18;
  color:var(--ink);
}
.hero-sub{ margin-top:16px; font-size:16px; color:var(--ink-soft); line-height:1.7; max-width:52ch; }
.hero-q{
  margin-top:22px; padding:14px 18px; border-radius:var(--radius-sm);
  background:var(--surface-alt); border-left:3px solid var(--accent);
  font-size:14px; font-weight:700; color:var(--ink);
}
.recruit-card{
  background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:22px; box-shadow:var(--shadow);
}
.recruit-tag{
  display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700;
  font-family:'JetBrains Mono',monospace; letter-spacing:.06em; color:var(--accent-ink);
  background:var(--accent-soft); padding:4px 10px; border-radius:100px;
}
.recruit-tag::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); }
.recruit-title{ margin-top:12px; font-size:19px; font-weight:900; }
.recruit-rows{ margin-top:14px; border-top:1px solid var(--border-soft); }
.recruit-row{
  display:flex; justify-content:space-between; gap:12px; padding:10px 0;
  border-bottom:1px solid var(--border-soft); font-size:13px;
}
.recruit-row dt{ color:var(--ink-soft); }
.recruit-row dd{ margin:0; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
.recruit-row small{ display:block; font-weight:400; color:var(--ink-faint); font-size:11px; margin-top:2px; }

/* ---------- section shell ---------- */
.section{ max-width:1180px; margin:0 auto; padding:64px 20px; }
.section.tint{ max-width:none; background:var(--surface-alt); border-top:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft); }
.section.tint > .section-inner{ max-width:1180px; margin:0 auto; padding:64px 20px; }
.section.dark{ max-width:none; background:var(--accent-deep); }
.section.dark > .section-inner{ max-width:1180px; margin:0 auto; padding:64px 20px; }

.sec-head{ display:flex; gap:18px; align-items:baseline; margin-bottom:30px; }
.sec-num{
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;
  color:var(--accent); flex:0 0 auto; padding-top:6px;
}
.sec-titles h2{ font-size:clamp(22px,3vw,30px); font-weight:900; letter-spacing:-.01em; line-height:1.3; }
.sec-titles p{ margin-top:8px; font-size:14px; color:var(--ink-soft); max-width:56ch; line-height:1.6; }
.dark .sec-titles h2, .dark .sec-titles p{ color:#fff; }
.dark .sec-titles p{ opacity:.7; }

/* 섹션 단위로 한 번, 마운트 즉시 짧게 들어오는 연출 — 스크롤 관찰자에 기대지 않는다.
   (전체 페이지 캡처·공유 미리보기 등 실제 스크롤이 일어나지 않는 상황에서도 항상 끝난 상태로 보여야 함) */
@keyframes riseIn{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
#app section{ animation:riseIn .5s cubic-bezier(.22,.7,.32,1) both; }
#app section:nth-of-type(1){ animation-delay:0s }
#app section:nth-of-type(2){ animation-delay:.03s }
#app section:nth-of-type(3){ animation-delay:.06s }
#app section:nth-of-type(4){ animation-delay:.09s }
#app section:nth-of-type(5){ animation-delay:.12s }
#app section:nth-of-type(6){ animation-delay:.15s }
#app section:nth-of-type(7){ animation-delay:.18s }
#app section:nth-of-type(8){ animation-delay:.2s }
#app section:nth-of-type(9){ animation-delay:.22s }
#app section:nth-of-type(10){ animation-delay:.24s }
#app section:nth-of-type(11){ animation-delay:.26s }
#app section:nth-of-type(12){ animation-delay:.28s }

/* 01 statement */
.statement{
  font-size:clamp(18px,2.4vw,24px); font-weight:700; line-height:1.6; color:#fff;
  max-width:44ch;
}
.statement em{ font-style:normal; color:var(--accent); background:none; }
.statement-body{ margin-top:16px; font-size:14.5px; line-height:1.8; color:rgba(255,255,255,.72); max-width:52ch; }

/* 02 fit */
.fit-lead{ font-size:15px; color:var(--ink-soft); line-height:1.7; max-width:60ch; margin-bottom:26px; }
.fit-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.fit-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:20px; display:flex; flex-direction:column; gap:12px;
}
.fit-card .idx{ font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--accent); }
.fit-card .q{ font-size:14.5px; font-weight:700; line-height:1.5; flex:1; }
.fit-card .why{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; padding-top:12px; border-top:1px dashed var(--border); }
.fit-card .why b{ color:var(--accent-ink); font-weight:700; }

/* 03 tools/output */
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.mini-panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:20px; }
.mini-panel h3{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.06em;
  color:var(--ink-faint); text-transform:uppercase; margin-bottom:14px;
}
.tool-item{ display:flex; gap:10px; padding:11px 0; border-top:1px solid var(--border-soft); }
.tool-item:first-child{ border-top:none; }
.tool-item .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:7px; flex:0 0 auto; }
.tool-item div b{ display:block; font-size:13.5px; font-weight:700; }
.tool-item div span{ display:block; font-size:12px; color:var(--ink-soft); margin-top:2px; line-height:1.5; }
.output-item{ display:flex; gap:12px; padding:11px 0; border-top:1px solid var(--border-soft); align-items:flex-start; }
.output-item:first-child{ border-top:none; }
.output-item .n{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:#fff;
  background:var(--accent); width:20px; height:20px; border-radius:50%; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; margin-top:1px;
}
.output-item span{ font-size:13px; line-height:1.6; }

/* 04 steps */
.steps{ position:relative; padding-left:26px; }
.steps::before{ content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:var(--border); }
.step{ position:relative; padding:0 0 30px 24px; }
.step:last-child{ padding-bottom:0; }
.step::before{
  content:""; position:absolute; left:-26px; top:2px; width:20px; height:20px; border-radius:50%;
  background:var(--surface); border:2px solid var(--accent);
}
.step .lbl{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--accent); letter-spacing:.04em; }
.step h4{ font-size:16px; font-weight:900; margin-top:4px; }
.step p{ font-size:13.5px; color:var(--ink-soft); margin-top:6px; line-height:1.65; max-width:56ch; }

/* 05 curriculum */
.curr-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px; }
.curr-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px; }
.curr-card h4{ font-size:13.5px; font-weight:900; margin-bottom:10px; line-height:1.4; }
.curr-card ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px; }
.curr-card li{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; padding-left:13px; position:relative; }
.curr-card li::before{ content:"—"; position:absolute; left:0; color:var(--accent); }
.curr-summary{
  background:var(--accent-soft); border-radius:var(--radius-md); padding:18px 20px;
  font-size:13px; color:var(--accent-ink); line-height:1.8;
}
.curr-summary b{ font-weight:700; }

/* 06 diff (dark, shared) */
.diff-grid{ display:grid; grid-template-columns:1fr 1.4fr; gap:28px; align-items:center; }
.stat-block{ text-align:left; }
.stat-num{ font-family:'JetBrains Mono',monospace; font-size:clamp(48px,7vw,76px); font-weight:700; color:#fff; line-height:1; }
.stat-cap{ margin-top:10px; font-size:13px; color:rgba(255,255,255,.6); line-height:1.6; max-width:26ch; }
.stat-note{ margin-top:14px; font-size:13px; color:var(--accent); font-weight:700; }
.diff-list{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.diff-item{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:var(--radius-md); padding:16px; }
.diff-item b{ display:block; color:#fff; font-size:14px; font-weight:700; }
.diff-item span{ display:block; margin-top:6px; font-size:12px; color:rgba(255,255,255,.6); line-height:1.6; }

/* 07 outcomes */
.outcome-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.outcome-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:18px; display:flex; flex-direction:column; gap:10px;
}
.outcome-card .n{ font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--accent); }
.outcome-card p{ font-size:13px; line-height:1.55; font-weight:500; }
.outcome-foot{
  margin-top:20px; padding:18px 20px; border-radius:var(--radius-md); background:var(--surface-alt);
  font-size:13px; color:var(--ink-soft); line-height:1.7;
}
.outcome-foot b{ color:var(--ink); }

/* 08 apply */
.apply-steps{ display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin-bottom:24px; }
.apply-step{ position:relative; padding:0 16px 0 0; }
.apply-step:not(:last-child)::after{
  content:"→"; position:absolute; right:-4px; top:10px; color:var(--ink-faint); font-size:14px;
}
.apply-step .n{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; color:var(--accent); }
.apply-step h4{ font-size:14.5px; font-weight:900; margin-top:6px; }
.apply-step p{ font-size:12px; color:var(--ink-soft); margin-top:5px; line-height:1.55; }
.apply-fund{
  display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:space-between;
  background:var(--accent-soft); border-radius:var(--radius-md); padding:20px 22px;
}
.apply-fund .figs{ display:flex; gap:26px; }
.apply-fund .figs div b{ display:block; font-size:21px; font-weight:900; letter-spacing:-.01em; color:var(--accent-ink); font-variant-numeric:tabular-nums; }
.apply-fund .figs div span{ font-size:11.5px; color:var(--ink-soft); }
.apply-fund p{ font-size:11.5px; color:var(--ink-soft); max-width:34ch; line-height:1.6; }

/* 09 terms */
.term-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
.term-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px; }
.term-card .t{ font-weight:900; font-size:16px; letter-spacing:-.01em; color:var(--accent-ink); }
.term-card .d{ margin-top:8px; font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
.term-closing{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; border-left:3px solid var(--accent); padding-left:16px; }

/* 10 roles */
.role-lead{ font-size:14.5px; color:var(--ink-soft); line-height:1.75; max-width:60ch; margin-bottom:24px; font-weight:500; }
.role-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
.role-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:18px; }
.role-card .lbl{ font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; color:var(--ink-faint); letter-spacing:.05em; }
.role-card h4{ font-size:14.5px; font-weight:900; margin-top:6px; }
.role-card p{ font-size:12px; color:var(--ink-soft); margin-top:7px; line-height:1.6; }
.future-list{ display:grid; gap:10px; }
.future-item{ display:flex; gap:10px; font-size:13px; color:var(--ink-soft); line-height:1.6; }
.future-item::before{ content:"↗"; color:var(--accent); font-weight:700; flex:0 0 auto; }

/* closing */
.closing{
  background:var(--accent-deep); border-radius:var(--radius-lg); padding:40px 32px;
  display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:center;
}
.closing h3{ color:#fff; font-size:20px; font-weight:900; line-height:1.4; }
.closing-out{ display:flex; flex-direction:column; gap:8px; }
.closing-out div{ display:flex; gap:10px; font-size:12.5px; color:rgba(255,255,255,.75); line-height:1.5; }
.closing-out div::before{ content:"✓"; color:var(--accent); font-weight:700; }

footer{ max-width:1180px; margin:0 auto; padding:30px 20px 60px; }
.disclaimer{ font-size:11.5px; color:var(--ink-faint); line-height:1.8; border-top:1px solid var(--border-soft); padding-top:20px; }
.footer-links{ margin-top:10px; font-size:11.5px; color:var(--ink-faint); }

/* mobile */
@media (max-width:860px){
  .hero{ grid-template-columns:1fr; padding-top:40px; }
  .fit-grid, .two-col, .curr-grid, .outcome-grid, .role-grid{ grid-template-columns:1fr; }
  .diff-grid{ grid-template-columns:1fr; }
  .diff-list{ grid-template-columns:1fr; }
  .apply-steps{ grid-template-columns:1fr 1fr; row-gap:20px; }
  .apply-step:nth-child(2)::after{ display:none; }
  .term-grid{ grid-template-columns:1fr 1fr; }
  .closing{ grid-template-columns:1fr; padding:28px 22px; }
  .section, .section.tint > .section-inner, .section.dark > .section-inner{ padding:44px 18px; }
  .apply-fund{ flex-direction:column; align-items:flex-start; }
}
@media (max-width:520px){
  .term-grid{ grid-template-columns:1fr; }
}
</style>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" aria-label="kt cloud TECH UP">
        <span class="bm-kt">kt<i class="bm-dot"></i>cloud</span>
        <span class="bm-techup">TECH UP</span>
      </div>
      <div class="brand-text">
        <b>테크업 커리큘럼 가이드</b>
        <span>국비지원 온라인 실시간 과정 안내</span>
      </div>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">🌓 화면 모드</button>
  </div>
  <div class="tracktabs" id="trackTabs" role="tablist" aria-label="과정 선택"></div>
</div>

<main id="app"></main>

<footer>
  <div class="disclaimer" id="footDisclaimer"></div>
</footer>

<script>
// ────────────────────────────────────────────────────────────────────────
// 5개 과정 데이터 — kt cloud TECH UP 상담자료 '과정 안내' 5개 탭 내용을 재구성.
// 공통 섹션(차별점 736h, 지원 절차, 용어 마무리 문구)은 5개 탭에서 동일했으므로 한 번만 둔다.
// ────────────────────────────────────────────────────────────────────────
const SHARED = {
  diff: {
    stat: "736h", statCap: "전체 1,056시간 중 프로젝트에 사용하는 시간",

// ── 렌더링 ─────────────────────────────────────────────────────────────
const app = document.getElementById('app');
const tabsEl = document.getElementById('trackTabs');
let current = 0;

function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t === 'dark') return true;
  if(t === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function applyAccent(track){
  const r = document.documentElement.style;
  r.setProperty('--accent', track.accent);
  r.setProperty('--accent-soft', isDark() ? track.accentSoftD : track.accentSoftL);
  r.setProperty('--accent-ink', isDark() ? track.accentInkD : track.accentInkL);
  r.setProperty('--accent-deep', track.accentDeep);
}

function renderTabs(){
  tabsEl.innerHTML = TRACKS.map((t,i)=>`
    <button class="tracktab" role="tab" data-i="${i}" aria-selected="${i===current}">
      <span class="num">${t.num}</span>${t.name}
    </button>`).join('');
  tabsEl.querySelectorAll('.tracktab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ current = Number(btn.dataset.i); render(); window.scrollTo({top:0, behavior:'smooth'}); });
  });
}

function fitCards(t){
  return t.fit.map((f,i)=>`
    <div class="fit-card">
      <div class="idx">Q${i+1}</div>
      <p class="q">${f.q}</p>
      <p class="why"><b>WHY ·</b> ${f.why}</p>
    </div>`).join('');
}

function toolItems(t){
  return t.tools.map(x=>`<div class="tool-item"><span class="dot"></span><div><b>${x.t}</b><span>${x.d}</span></div></div>`).join('');
}
function outputItems(t){
  return t.outputs.map((x,i)=>`<div class="output-item"><span class="n">${i+1}</span><span>${x}</span></div>`).join('');
}
function stepItems(t){
  return t.steps.map((s,i)=>`
    <div class="step">
      <div class="lbl">STEP 0${i+1}</div>
      <h4>${s.t}</h4><p>${s.d}</p>
    </div>`).join('');
}
function currCards(t){
  return t.curriculum.map(c=>`
    <div class="curr-card">
      <h4>${c.cat}</h4>
      <ul>${c.items.map(i=>`<li>${i}</li>`).join('')}</ul>
    </div>`).join('');
}
function diffItems(){
  return SHARED.diff.items.map(d=>`<div class="diff-item"><b>${d.t}</b><span>${d.d}</span></div>`).join('');
}
function outcomeCards(t){
  return t.outcomes.map((o,i)=>`<div class="outcome-card"><div class="n">0${i+1}</div><p>${o}</p></div>`).join('');
}
function applySteps(){
  return SHARED.apply.steps.map((s,i)=>`
    <div class="apply-step">
      <div class="n">0${i+1}</div><h4>${s.t}</h4><p>${s.d}</p>
    </div>`).join('');
}
function termCards(t){
  return t.terms.map(x=>`<div class="term-card"><div class="t">${x.t}</div><div class="d">${x.d}</div></div>`).join('');
}
function roleCards(t){
  return t.roles.map((r,i)=>`
    <div class="role-card">
      <div class="lbl">ROLE 0${i+1}</div><h4>${r.t}</h4><p>${r.d}</p>
    </div>`).join('');
}
function futureItems(t){
  return t.future.map(f=>`<div class="future-item">${f}</div>`).join('');
}

function render(){
  const t = TRACKS[current];
  applyAccent(t);
  renderTabs();

  app.innerHTML = `
    <section class="hero">
      <div>
        <div class="hero-eyebrow">TRACK ${t.num} · ${t.name}</div>

          <div class="recruit-row"><dt>교육 일정</dt><dd>${t.schedule}</dd></div>
          <div class="recruit-row"><dt>교육 방식</dt><dd>${t.method}</dd></div>

    </section>

    <section class="section">

      <p class="fit-lead">${t.fitLead}</p>
      <div class="fit-grid">${fitCards(t)}</div>
    </section>

    <section class="section tint"><div class="section-inner">

      <div class="steps">${stepItems(t)}</div>
    </section>

    <section class="section tint"><div class="section-inner">
      <div class="sec-head"><span class="sec-num">05</span><div class="sec-titles"><h2>세부 커리큘럼</h2><p>과정별 주요 교과목과 실습 내용입니다.</p></div></div>
      <div class="curr-grid">${currCards(t)}</div>
      <div class="curr-summary"><b>이 과정에서 배우는 것 ·</b> ${t.currSummary}</div>
    </div></section>

    <section class="section dark"><div class="section-inner">
      <div class="sec-head"><span class="sec-num">06</span><div class="sec-titles"><h2 style="color:#fff">왜 특별한 기회인가요?</h2><p>혼자 공부해서 얻기 어려운 경험을 한 과정에 모았습니다.</p></div></div>
      <div class="diff-grid">
        <div class="stat-block">
          <div class="stat-num">${SHARED.diff.stat}</div>
          <p class="stat-cap">${SHARED.diff.statCap}</p>
          <p class="stat-note">${SHARED.diff.statNote}</p>
        </div>
        <div class="diff-list">${diffItems()}</div>
      </div>
    </div></section>

    <section class="section">
      <div class="sec-head"><span class="sec-num">07</span><div class="sec-titles"><h2>교육 후 무엇이 남나요?</h2></div></div>
      <div class="outcome-grid">${outcomeCards(t)}</div>
      <div class="outcome-foot"><b>취업 준비로 연결 ·</b> 완성한 프로젝트는 이력서와 포트폴리오에 활용하고, 면접에서 본인의 역할과 문제 해결 과정을 설명할 수 있는 경험이 됩니다.</div>
    </section>

    <section class="section tint"><div class="section-inner">
      <div class="sec-head"><span class="sec-num">08</span><div class="sec-titles"><h2>지원부터 최종 합격까지</h2></div></div>
      <div class="apply-steps">${applySteps()}</div>
      <div class="apply-fund">
        <div class="figs">
          <div><b>${SHARED.apply.fund}</b><span>국비 지원</span></div>
          <div><b>${SHARED.apply.selfPay}</b><span>자비 부담금</span></div>
        </div>
        <p>${SHARED.apply.note}</p>
      </div>
    </div></section>

    <section class="section">
      <div class="sec-head"><span class="sec-num">09</span><div class="sec-titles"><h2>처음 보는 말도 쉽게 이해하기</h2></div></div>
      <div class="term-grid">${termCards(t)}</div>
      <p class="term-closing">${SHARED.termsClosing}</p>
    </section>

    <section class="section tint"><div class="section-inner">
      <div class="sec-head"><span class="sec-num">10</span><div class="sec-titles"><h2>교육 후 어떤 일을 하나요?</h2></div></div>
      <p class="role-lead">${t.careerValue}</p>
      <div class="role-grid">${roleCards(t)}</div>
      <div class="future-list">${futureItems(t)}</div>
    </div></section>

    <section class="section">
      <div class="closing">
        <h3>${t.name} 과정을 마치면,<br>이 4가지가 남습니다.</h3>
        <div class="closing-out">${t.outputs.map(o=>`<div>${o}</div>`).join('')}</div>
      </div>
    </section>
  `;

  document.getElementById('footDisclaimer').innerHTML =
    `실제 교육 일정, 지원 금액, 프로젝트 주제는 매 기수 모집 공고에 따라 달라질 수 있으며 채용이나 수료를 보장하지 않습니다. ` +
    `본 자료는 kt cloud TECH UP 상담 정보를 수강생 안내용으로 재구성한 참고 자료입니다.`;
}

// ── 테마 토글 ──────────────────────────────────────────────────────────
(function initTheme(){
  // 기기의 시스템 다크모드 설정과 상관없이 첫 화면은 항상 베이지(라이트)로 보여준다 —
  // 방문자가 직접 화면 모드 버튼을 눌러야만 다크로 바뀌고, 그 선택은 다음 방문까지 기억된다.
  let saved = null;
  try{ saved = localStorage.getItem('techup-theme'); }catch(e){}
  document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
  document.getElementById('themeToggle').addEventListener('click', ()=>{
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('techup-theme', next); }catch(e){}
    applyAccent(TRACKS[current]);
  });
})();

render();
</script>
